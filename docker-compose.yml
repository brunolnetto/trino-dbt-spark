services:
      
  de_psql:
    image: postgres:15
    container_name: de_psql
    healthcheck:
        test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
        interval: 10s
        timeout: 5s
        retries: 5
        start_period: 30s
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - psql_data:/var/lib/postgresql/data
      - ./docker/psql/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    env_file:
      - .env
    networks:
      - data_network
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2'
        reservations:
          memory: 1G
          cpus: '1'

  minio:
    hostname: minio
    image: "minio/minio"
    container_name: minio
    ports:
      - "9001:9001"
      - "9000:9000"
    command: [ "server", "/data", "--console-address", ":9001" ]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - minio_data:/data
    env_file:
      - .env
    networks:
      - data_network
  
  minio-init:
    image: minio/mc
    container_name: minio_init
    entrypoint: ["/bin/sh", "-c"]
    command: ["/scripts/minio_setup.sh"]
    env_file:
      - .env
    volumes:
      - ./docker/minio/:/scripts/:ro
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - data_network

  # Alternative simpler catalog service
  iceberg-rest:
    build:
      context: ./docker/iceberg-rest
      dockerfile: Dockerfile
    container_name: iceberg-rest
    ports:
      - "8181:8181"
    environment:
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER:-admin}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-password}
      - AWS_REGION=us-east-1
      - AWS_ENDPOINT_URL=http://minio:9000
      - AWS_S3_ENDPOINT=http://minio:9000
      - AWS_S3_PATH_STYLE_ACCESS=true
      - CATALOG_WAREHOUSE=s3://warehouse/
      - CATALOG_IO__IMPL=org.apache.iceberg.aws.s3.S3FileIO
      - CATALOG_S3_ENDPOINT=http://minio:9000
      - CATALOG_S3_PATH_STYLE_ACCESS=true
      - CATALOG_S3_REGION=us-east-1
      - CATALOG_S3_ACCESS_KEY_ID=${MINIO_ROOT_USER:-admin}
      - CATALOG_S3_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-password}
      - CATALOG_CATALOG__IMPL=org.apache.iceberg.jdbc.JdbcCatalog
      - CATALOG_URI=jdbc:postgresql://de_psql:5432/iceberg_catalog
      - CATALOG_JDBC_USER=${POSTGRES_USER:-admin}
      - CATALOG_JDBC_PASSWORD=${POSTGRES_PASSWORD:-admin123}
    depends_on:
      minio:
        condition: service_healthy
      de_psql:
        condition: service_healthy
    # Built-in healthcheck from Dockerfile
    networks:
      - data_network

  trino:
    image: "trinodb/trino:427"
    container_name: trino
    hostname: trino
    env_file:
      - .env
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: '4'
        reservations:
          memory: 4G
          cpus: '2'
    depends_on:
      - iceberg-rest
      - minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/info/state"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    ports:
      - "8081:8080"
    volumes:
      - ./docker/trino:/etc/trino
      - trino_logs:/var/log/trino
    networks:
      - data_network

  spark-master:
    image: tabulario/spark-iceberg:3.5.1_1.4.3
    container_name: "spark-master"
    environment:
      - SPARK_MODE=master
      - SPARK_MASTER_HOST=spark-master
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://$(hostname):8080 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      iceberg-rest:
        condition: service_healthy
    ports:
      - "7077:7077"
      - "8082:8080"
      - "10000:10000"
    volumes:
      - spark_logs:/opt/spark/logs
    networks:
      - data_network

  spark-worker:
    image: tabulario/spark-iceberg:3.5.1_1.4.3
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=1
    env_file:
      - .env
    volumes:
      - spark_logs:/opt/spark/logs
    healthcheck:
      test: ["CMD-SHELL", "ps -ef | grep -v grep | grep 'org.apache.spark.deploy.worker.Worker' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      spark-master:
        condition: service_healthy
      iceberg-rest:
        condition: service_healthy
    networks:
      - data_network
    deploy:
      replicas: 2

  metabase:
    image: metabase/metabase:v0.47.4
    container_name: metabase
    hostname: metabase
    volumes:
      - /dev/urandom:/dev/random:ro
    ports:
      - 3000:3000
    env_file:
      - .env
    networks:
      - data_network
    depends_on:
      de_psql:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1'
        reservations:
          memory: 1G
    healthcheck:
      test: curl --fail -I http://localhost:3000/api/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  psql_data:
  minio_data:
  spark_logs:
  trino_logs:
  warehouse_data:

networks:
  data_network:
    driver: bridge
    name: data_network
